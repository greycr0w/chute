# Local git hooks (the "post-hook" piece). Install once:
#   uv run --no-sync pre-commit install
# Then ruff + these checks run on every commit, so CI never fails on something
# you could have caught locally.
#
# Third-party hook repos are intentionally frozen to commit SHAs. Refresh with:
#   uv run --no-sync pre-commit autoupdate --freeze
minimum_pre_commit_version: "4.6.0"
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 22f0422809455ec89ffdcf5a00170ba816e42ddb # frozen: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # frozen: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key # refuses to commit a PEM private key
