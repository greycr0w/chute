# Wildcard vhost for *.__BASE_DOMAIN__ -> the chute Host-label router.
#
# nginx owns TLS (the dehydrated wildcard cert) and proxies plain HTTP to chute
# on 127.0.0.1:__PUBLIC_PORT__; chute routes by Host to the right agent. Installed by
# deploy/deploy.sh as /etc/nginx/sites-available/chute.conf (symlinked into
# sites-enabled). Specific server_name => it does not shadow the box's other vhosts.
#
# NB: there is deliberately NO `upstream {}` keepalive block. chute decides the
# route once per connection, so each request must be its own upstream connection
# (nginx's default without keepalive). Don't "optimize" that away.

map $http_upgrade $chute_connection_upgrade {
    default upgrade;
    ''      close;
}

# NOTE on X-Forwarded-For: we forward the chain as-is ($proxy_add_x_forwarded_for
# appends the real peer to whatever the client sent), staying a transparent pipe
# rather than rewriting a request header. So a client CAN forge earlier XFF hops.
# Apps served through chute MUST treat client-supplied X-Forwarded-For as
# untrusted and derive the real client IP from X-Real-IP (set to $remote_addr
# below) or the right-most XFF hop -- never the left-most.

# ---- HTTP :80 -- stays HTTP on purpose (the iframe / postMessage workflow) ----
# We do NOT redirect to https here. The per-tunnel scheme decides the URL the SDK
# hands out; serving plain HTTP with no upgrade is the whole reason chute exists.
server {
    listen 80;
    listen [::]:80;
    server_name *.__BASE_DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:__PUBLIC_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;                 # chute routes on this
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chute_connection_upgrade;
        proxy_read_timeout 3600s;                    # long-lived SSE / WebSocket
        proxy_send_timeout 3600s;
        proxy_buffering off;                         # stream responses, no buffering
    }
}

# ---- HTTPS :443 -- for the "normal web app" tunnels (scheme="https") ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.__BASE_DOMAIN__;

    ssl_certificate     __CERT_ROOT__/__BASE_DOMAIN__/fullchain.pem;
    ssl_certificate_key __CERT_ROOT__/__BASE_DOMAIN__/privkey.pem;

    # Pin nginx's own TLS floor so it doesn't silently depend on box defaults.
    # Deliberately NO HSTS and NO :80->:443 redirect: forced HTTPS upgrade is the
    # exact thing chute exists to avoid (the iframe/postMessage workflow).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    location / {
        proxy_pass http://127.0.0.1:__PUBLIC_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chute_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
