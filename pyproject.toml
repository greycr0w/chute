[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chute"
version = "0.2.0"
description = "A tiny, self-hosted, zero-maintenance HTTP tunnel -- your own ngrok."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "websockets>=12.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "build>=1.0",
]

[project.scripts]
chute = "chute.cli:agent_main"
chuted = "chute.cli:server_main"

[tool.hatch.build.targets.wheel]
packages = ["src/chute"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests favor readable long assert strings and intentionally-broad raises.
"tests/**" = ["E501", "B017"]
