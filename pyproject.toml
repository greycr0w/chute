[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "chute"
version = "0.4.0"
description = "A tiny, self-hosted, zero-maintenance HTTP tunnel -- your own ngrok."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "greycr0w" }]
keywords = ["tunnel", "ngrok", "reverse-proxy", "websocket", "self-hosted", "http-tunnel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    # Bounded to the tested major. Prod installs from source via pip (deploy.sh), not
    # from uv.lock, so an unbounded floor could pull an untested major; the ceiling
    # keeps prod on the same major the suite + lock run against. (>=16 is also where
    # the websockets asyncio implementation chute relies on is the default.)
    "websockets>=16,<17",
    # cryptography 42.0.0 through 44.0.0 wheels bundle vulnerable OpenSSL
    # (GHSA-79v4-65xg-pq4g / CVE-2024-12797); keep the runtime floor at the
    # first patched release even though the lock currently resolves newer.
    "cryptography>=48.0.1,<49",
]

[project.urls]
Homepage = "https://github.com/greycr0w/chute"
Repository = "https://github.com/greycr0w/chute"
Issues = "https://github.com/greycr0w/chute/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "build>=1.0",
    "hypothesis>=6.0",
    "cyclonedx-bom==7.3.0",
    "pip-audit==2.10.0",
    "pre-commit==4.6.0",
    "ruff==0.15.15",
]
fuzz = [
    "atheris>=3.0,<4",
]

[project.scripts]
chute = "chute.cli:agent_main"
chuted = "chute.cli:server_main"

[tool.hatch.build.targets.wheel]
packages = ["src/chute"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
# 0.5.26 is the oldest uv version known to generate and consume the current lock/export flow.
required-version = ">=0.5.26"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "fuzz"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "RUF006"]

[tool.ruff.lint.per-file-ignores]
# Tests favor readable long assert strings and intentionally-broad raises.
"tests/**" = ["E501", "B017"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/chute"]

[tool.coverage.run]
source = ["chute"]
branch = true

[tool.coverage.report]
show_missing = true
