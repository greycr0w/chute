name: Release

# Tag a version (e.g. `git tag v0.2.0 && git push --tags`) and this builds the
# wheel + sdist and attaches them to a GitHub Release. No PyPI (no third party):
# you `pipx install` the wheel straight from the Release, or pip install it.
on:
  push:
    tags: ["v*"]

# Least privilege at the workflow scope; the release job widens to exactly what it needs.
permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release
      id-token: write # OIDC, for the build-provenance attestation
      attestations: write # record the provenance attestation
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.5.26"
      - name: Install locked release tooling
        run: uv sync --locked --extra dev
      - name: Build wheel + sdist
        run: uv build
      - name: Generate runtime SBOM
        run: scripts/generate_release_sbom.sh
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/chute-runtime-sbom.cdx.json
      - name: Attest runtime SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/chute-runtime-sbom.cdx.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
