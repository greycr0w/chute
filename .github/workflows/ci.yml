name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# A new push to a branch/PR cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.5.26"
          enable-cache: true
      - name: Install locked lint tools
        run: uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github .
      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.5.26"
          enable-cache: true
      # --locked makes the committed uv.lock load-bearing: it errors if the lock
      # has drifted from pyproject.toml, so a stale lock fails CI instead of being
      # silently re-resolved.
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: mypy --strict
        run: uv run --no-sync mypy
      - name: deploy/requirements.txt matches the lock
        # Prod installs from this hash-pinned export; fail if it has drifted from uv.lock.
        run: |
          uv export --frozen --no-dev --no-emit-project -o deploy/requirements.txt
          git diff --exit-code -- deploy/requirements.txt
      - name: Audit production dependencies
        # Audit the same runtime dependency set prod installs, using the locked dev toolchain.
        run: uv run --no-sync pip-audit -r deploy/requirements.txt --disable-pip
      - name: deploy/build-requirements.txt matches its input
        # Prod disables pip build isolation, so the build backend is pinned and hash-checked too.
        run: |
          uv pip compile --generate-hashes --universal \
            deploy/build-requirements.in -o deploy/build-requirements.txt
          git diff --exit-code -- deploy/build-requirements.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.5.26"
          enable-cache: true
      # The universal uv.lock resolves across the whole matrix; --locked pins the
      # exact dependency set on every Python version for reproducible runs.
      - name: Install (locked)
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Test
        run: uv run --no-sync python -m pytest -q --cov=chute --cov-report=term-missing
