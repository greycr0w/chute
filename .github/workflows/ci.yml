name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# A new push to a branch/PR cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff lint
        run: uvx ruff@0.15.15 check --output-format=github .
      - name: Ruff format check
        run: uvx ruff@0.15.15 format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --locked makes the committed uv.lock load-bearing: it errors if the lock
      # has drifted from pyproject.toml, so a stale lock fails CI instead of being
      # silently re-resolved.
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: mypy --strict
        run: uv run --no-sync mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The universal uv.lock resolves across the whole matrix; --locked pins the
      # exact dependency set on every Python version for reproducible runs.
      - name: Install (locked)
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Test
        run: uv run --no-sync pytest -q --cov=chute --cov-report=term-missing
