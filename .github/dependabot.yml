# Keep dependencies and SHA-pinned actions current. Dependabot bumps a pinned action
# to the latest commit for its major and refreshes the trailing "# vX" comment, and
# flags vulnerable Python dependencies against the lock.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
